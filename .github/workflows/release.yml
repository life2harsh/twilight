name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
          - os: ubuntu-24.04
            name: linux
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/setup-nasm@v1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang libclang-dev libgbm-dev libxcb1-dev libxcb-randr0-dev \
            libxkbcommon-dev libwayland-dev libdrm-dev libegl-dev libpipewire-0.3-dev libdbus-1-dev libxrandr-dev \
            libtcl8.6 libtk8.6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Host
        working-directory: host
        run: |
          cargo build --release --locked
          cargo test --release --locked -q
      - name: Client
        working-directory: client
        shell: bash
        run: |
          uv sync
          uv run pytest -q
          LD_LIBRARY_PATH="$(uv run python -c 'import sys; print(sys.base_prefix)')/lib" \
            uv run --with pyinstaller pyinstaller --onefile --windowed --name Twilight client.py
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp client/dist/Twilight${{ matrix.ext }} out/Twilight-${{ matrix.name }}${{ matrix.ext }}
          cp host/target/release/twilight-host${{ matrix.ext }} out/twilight-host-${{ matrix.name }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust cmake nasm uv clang mesa libxcb libxkbcommon wayland libdrm pipewire dbus libxrandr
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          chown -R builder .
          su builder -c "cd packaging/arch && makepkg --noconfirm"
          mkdir out
          cp packaging/arch/*.pkg.tar.zst out/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Twilight $GITHUB_REF_NAME" --notes-file DOWNLOAD.md
